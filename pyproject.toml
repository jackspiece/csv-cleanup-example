[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "csv-cleanup-example"
version = "0.1.0"
description = "Clean CSV files while preserving IDs, review rows and a change log."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "jackspiece" }]
keywords = ["csv", "cli", "data-cleaning", "data-processing", "zero-dependencies"]
classifiers = [
  "Environment :: Console",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Utilities",
]
dependencies = []

[project.scripts]
tidy-csv = "tidy_csv:main"
profile-csv = "profile_csv:main"
check-rules = "check_rules:main"

[project.urls]
Homepage = "https://github.com/jackspiece/csv-cleanup-example"
Demo = "https://jackspiece.github.io/csv-cleanup-example/"
Issues = "https://github.com/jackspiece/csv-cleanup-example/issues"

[tool.setuptools]
py-modules = ["tidy_csv", "profile_csv", "check_rules", "review_rules"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
